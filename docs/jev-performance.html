<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Jev — Judgement Evaluation · Interactive explainer</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#101722; --panel2:#0d141d; --line:#1d2836; --text:#dce5f0;
    --muted:#8496ab; --faint:#5b6b7f;
    --jev:#34d399; --base:#7c8ba1; --gen:#fbbf24; --exec:#38bdf8; --ax:#a78bfa;
    --resolve:#f87171; --guard:#f59e0b; --danger:#f87171;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,
    "PingFang HK","Hiragino Sans TC","Microsoft JhengHei","Noto Sans TC",sans-serif;}
  html[lang="zh-HK"] body{line-height:1.7}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
  a{color:#7dd3fc}
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
  h2{font-size:20px;margin:44px 0 4px;letter-spacing:-.01em}
  h2 .n{color:var(--faint);font-weight:600;margin-right:8px}
  h3{font-size:16.5px;margin:32px 0 6px;letter-spacing:-.01em}
  h3 .n{color:var(--faint);font-weight:600;margin-right:8px}
  nav#topnav{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 30px}
  nav#topnav a{color:#9db4c8;text-decoration:none;border:1px solid var(--line);border-radius:999px;
    padding:5px 14px;font-size:12.5px;background:var(--panel)}
  nav#topnav a:hover{color:#dce5f0;border-color:#33465e}
  .quote{border-left:3px solid var(--exec);background:var(--panel2);padding:10px 14px;
    border-radius:0 10px 10px 0;color:var(--muted);font-size:13.5px;margin:16px 0 6px}
  .quote b{color:var(--text)}
  .sub{color:var(--muted);margin:0 0 18px}
  .note{color:var(--muted);font-size:13.5px;margin:6px 0 14px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;min-width:150px}
  .chip .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .chip .v em{font-style:normal;color:var(--jev)}
  .chip .v s{color:var(--base);text-decoration:none}
  .chip .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  html[lang="zh-HK"] .chip .k{letter-spacing:.02em}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .btn{appearance:none;border:1px solid var(--line);background:#16202e;color:var(--text);
    border-radius:9px;padding:7px 14px;font-size:13.5px;cursor:pointer}
  .btn:hover{border-color:#33465e}
  .btn.primary{background:#123529;border-color:#1f5c43;color:#a7f3d0}
  .btn:disabled{opacity:.45;cursor:default}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;font-size:13px;cursor:pointer}
  .seg button.active{background:#16202e;color:var(--text)}
  #langSeg{margin-left:auto}
  #langSeg button{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 4px;font-size:12.5px;color:var(--muted)}
  .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  /* Part 1 — loop anatomy */
  #loopDiagram{display:flex;flex-direction:column;gap:10px}
  .phase{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel2);transition:all .25s;opacity:.45}
  .phase.active{opacity:1;border-color:#2a5f4b;background:#0f1d18;transform:translateX(4px)}
  .phase.done{opacity:.75}
  .phase .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);min-width:86px}
  html[lang="zh-HK"] .phase .tag{text-transform:none;letter-spacing:.03em}
  .phase .body{flex:1}
  .phase .t{font-weight:600}
  .phase .d{color:var(--muted);font-size:12.5px;margin-top:1px}
  .phase .cost{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
  .phase.active .cost{color:#a7f3d0;border-color:#1f5c43}
  .fanout{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .head{font-size:12px;border:1px dashed #33465e;border-radius:8px;padding:5px 10px;color:var(--muted);
    transition:all .3s}
  .head.win{border:1px solid var(--jev);color:var(--jev);background:#0c211a}
  .head.dead{opacity:.35;text-decoration:line-through}
  #loopCaption{min-height:44px;color:var(--muted);font-size:13.5px;margin-top:12px;padding:10px 14px;
    border-left:3px solid var(--jev);background:var(--panel2);border-radius:0 10px 10px 0}
  #loopCaption b{color:var(--text)}
  .ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}

  /* Part 2 — composition bars */
  .compbar{margin:20px 0 6px}
  .compbar .label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .compbar .label b{font-size:15px}
  .bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .bar span{display:block;height:100%;position:relative}
  .compnote{color:var(--muted);font-size:13px;margin-top:12px}
  .compnote b{color:var(--text)}
  .callout{border:1px solid #1f5c43;background:#0c1a14;border-radius:12px;padding:12px 16px;margin-top:14px;font-size:13.5px;color:#c7e8d9}

  /* Part 3 — waterfall */
  #wfWrap{position:relative}
  #wf{width:100%;height:auto;display:block}
  #wf text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  html[lang="zh-HK"] #wf text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang HK","Microsoft JhengHei","Noto Sans TC",monospace}
  #tooltip{position:fixed;pointer-events:none;background:#0b1119;border:1px solid #2a3b52;border-radius:9px;
    padding:8px 11px;font-size:12.5px;color:var(--text);opacity:0;transition:opacity .12s;z-index:9;max-width:340px}
  #tooltip .tt-t{font-weight:700;margin-bottom:3px}
  #tooltip .tt-d{color:var(--muted)}
  #wfStep{margin-top:14px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);
    font-size:13.5px;color:var(--muted);min-height:64px}
  #wfStep b{color:var(--text)}
  .mark{font-size:12px}

  /* Part 4 — dumbbells */
  #dumb{width:100%;height:auto;display:block}
  #dumb text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  html[lang="zh-HK"] #dumb text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang HK","Microsoft JhengHei","Noto Sans TC",monospace}
  .caveat{color:var(--muted);font-size:13px;margin-top:12px;border-left:3px solid var(--guard);padding:8px 12px;background:var(--panel2);border-radius:0 8px 8px 0}
  footer{margin-top:56px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--line);padding-top:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2)}
  .mini .h{font-weight:700;font-size:13.5px;margin-bottom:4px}
  .mini .b{color:var(--muted);font-size:12.5px}
  /* Part 6 — Kahneman */
  .ktable{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 16px}
  .ktable th,.ktable td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  .ktable th{background:var(--panel2);font-weight:700}
  .ktable th:first-child{width:1px;white-space:nowrap}
  .ktable td:first-child{color:var(--muted);white-space:nowrap;font-size:12.5px}
  .kcard{border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-top:10px;overflow:hidden;transition:border-color .2s}
  .kcard.open{border-color:#2a5f4b}
  .khead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;
    color:var(--text);font-weight:600;font-size:13.5px;user-select:none}
  .khead:hover{background:#121b28}
  .karrow{color:var(--faint);font-weight:400}
  .kbody{display:none;padding:0 14px 13px;color:var(--muted);font-size:13px}
  .kcard.open .kbody{display:block}
  .kbody b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">

  <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
    <div style="flex:1;min-width:280px">
      <h1 id="h1"></h1>
      <p class="sub" id="subTitle"></p>
    </div>
    <div class="seg" id="langSeg" role="group" aria-label="Language">
      <button data-l="en" class="active">English</button>
      <button data-l="zhHK">粵語〈香港〉</button>
    </div>
  </div>

  <nav id="topnav">
    <a href="#sec-intro" data-i18n="navIntro"></a>
    <a href="#sec-book" data-i18n="navBook"></a>
    <a href="#sec-how" data-i18n="navHow"></a>
    <a href="#sec-demo" data-i18n="navDemo"></a>
  </nav>

  <h2 id="sec-intro" style="margin-top:24px"><span class="n">1</span><span data-i18n="secIntro_h"></span></h2>
  <p data-i18n="introA" style="color:var(--text);font-size:15.5px;margin:8px 0 10px"></p>
  <p data-i18n="introB"></p>

  <div class="chips">
    <div class="chip"><div class="v"><s>9.45 s</s> → <em>7.09 s</em></div><div class="k" data-i18n="chipTime"></div></div>
    <div class="chip"><div class="v"><s>1,092</s> → <em>101</em></div><div class="k" data-i18n="chipCdp"></div></div>
    <div class="chip"><div class="v"><s>22</s> → <em>17</em></div><div class="k" data-i18n="chipTs"></div></div>
    <div class="chip"><div class="v">178 <span style="font-size:13px;color:var(--muted)">ms</span></div><div class="k" data-i18n="chipLat"></div></div>
    <div class="chip"><div class="v">$0.000063</div><div class="k" data-i18n="chipCost"></div></div>
  </div>

  <div class="quote" data-i18n="introGoal"></div>

  <!-- ============ SECTION 2 · THE BOOK ============ -->
  <h2 id="sec-book"><span class="n">2</span><span data-i18n="p6h"></span></h2>
  <p class="note" data-i18n="p6note"></p>
  <div class="panel">
    <div id="kb"></div>
    <div class="callout" id="kbCallout" style="margin-top:16px"></div>
  </div>

  <!-- ============ SECTION 3 · HOW IT WORKS ============ -->
  <h2 id="sec-how"><span class="n">3</span><span data-i18n="secHow_h"></span></h2>
  <p class="note" data-i18n="secHow_note"></p>

  <!-- ==== 3.1 LOOP ANATOMY ==== -->
  <h3><span class="n">3.1</span><span data-i18n="p1h"></span></h3>
  <p class="note" data-i18n="p1note"></p>
  <div class="panel">
    <div id="loopDiagram"></div>
    <div id="loopCaption"></div>
    <div class="ctrls">
      <button class="btn primary" id="loopPlay"></button>
      <button class="btn" id="loopPrev"></button>
      <button class="btn" id="loopNext"></button>
      <button class="btn" id="loopReset"></button>
      <span style="color:var(--faint);font-size:12.5px" id="loopPos"></span>
    </div>
  </div>

  <!-- ==== 3.2 ELIMINATED CALLS ==== -->
  <h3><span class="n">3.2</span><span data-i18n="p2h"></span></h3>
  <p class="note" data-i18n="p2note"></p>
  <div class="panel">
    <div class="compbar">
      <div class="label"><b data-i18n="origLoop"></b><span class="mono">1,092 calls</span></div>
      <div class="bar" id="barBase"></div>
    </div>
    <div class="compbar">
      <div class="label"><b data-i18n="jevLoop"></b><span class="mono">97 calls</span></div>
      <div class="bar" id="barCand"></div>
    </div>
    <div class="legend" id="compLegend"></div>
    <div class="compnote" id="compNote"></div>
    <div class="callout" id="compCallout"></div>
  </div>

  <!-- ==== 3.3 WHAT CHANGED ==== -->
  <h3><span class="n">3.3</span><span data-i18n="p5h"></span></h3>
  <div class="grid2">
    <div class="mini"><div class="h" data-i18n="w1h"></div><div class="b" data-i18n="w1b"></div></div>
    <div class="mini"><div class="h" data-i18n="w2h"></div><div class="b" data-i18n="w2b"></div></div>
    <div class="mini"><div class="h" data-i18n="w3h"></div><div class="b" data-i18n="w3b"></div></div>
    <div class="mini"><div class="h" data-i18n="w4h"></div><div class="b" data-i18n="w4b"></div></div>
  </div>

  <!-- ============ SECTION 4 · INTERACTIVE DEMO ============ -->
  <h2 id="sec-demo"><span class="n">4</span><span data-i18n="secDemo_h"></span></h2>
  <p class="note" data-i18n="secDemo_note"></p>

  <!-- ==== 4.1 RECORDED RUN ==== -->
  <h3><span class="n">4.1</span><span data-i18n="p3h"></span></h3>
  <p class="note" data-i18n="p3note"></p>
  <div class="panel">
    <div class="ctrls" style="margin:0 0 10px">
      <button class="btn primary" id="wfPlay"></button>
      <div class="seg" id="wfSpeed">
        <button data-s="0.5">0.5×</button><button data-s="1" class="active">1×</button>
        <button data-s="2">2×</button><button data-s="4">4×</button>
      </div>
      <span style="color:var(--faint);font-size:12.5px" data-i18n="wfHint"></span>
      <span class="mono" id="wfClock" style="margin-left:auto;font-size:15px">0.000 s</span>
    </div>
    <div id="wfWrap">
      <svg id="wf" viewBox="0 0 1060 470" role="img" aria-label="Waterfall of the recorded run"></svg>
      <div id="tooltip"></div>
    </div>
    <div class="legend" id="wfLegend"></div>
    <div id="wfStep"></div>
    <div class="legend" style="margin-top:10px" id="wfCounters"></div>
  </div>

  <!-- ==== 4.2 MATCHED A/B ==== -->
  <h3><span class="n">4.2</span><span data-i18n="p4h"></span></h3>
  <p class="note" data-i18n="p4note"></p>
  <div class="panel">
    <div class="ctrls" style="margin:0 0 8px">
      <div class="seg" id="metricSeg">
        <button data-m="ms" class="active" data-i18n="mMs"></button>
        <button data-m="cdp" data-i18n="mCdp"></button>
        <button data-m="ts" data-i18n="mTs"></button>
      </div>
    </div>
    <svg id="dumb" viewBox="0 0 1060 300" role="img" aria-label="Matched comparison dumbbell chart"></svg>
    <div class="caveat" id="abNote"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
"use strict";
/* ============================ i18n ============================ */
const STR = {
en: {
  title:"Jev — Judgement Evaluation · Interactive explainer",
  h1:`<span style="color:var(--jev)">Jev</span> — Judgement Evaluation`,
  subTitle:"A visual explainer of TypeSafe's “System One” judgement-evaluation model, built entirely on this repo's real measurements. The worked example throughout: one natural-language goal → a 7.073-second Google Flights search.",

  navIntro:"Introduction", navBook:"The Kahneman connection", navHow:"How it works", navDemo:"Interactive demo",
  secIntro_h:"Introduction",
  introA:"<b>Judgement evaluation</b> is the whole contract: you hand Jev a state and a closed set of possible answers, and it returns typed decisions with calibrated probabilities in ~100–250 ms. No text generation, no chain-of-thought — just fast, structured judgement your code can act on.",
  introB:"This page shows what that looks like in practice, using nothing but this repo's real measurements. <b>Section 2</b> sets the frame with Kahneman's <i>Thinking, Fast and Slow</i> (Traditional Chinese edition 《快思慢想》) — Jev is a System 1 for software. <b>Section 3</b> shows how the loop works and where 991 browser calls were eliminated. <b>Section 4</b> is hands-on: replay the real 7.073-second run action by action, then compare the matched A/B measurements. Every number is real — sources in the footer.",
  introGoal:`The task given to the agent: “<b>Find one-way flights from Zurich to London on September 20, 2026, for one adult in economy. Stop when matching flight options are visible. Do not select or book a flight.</b>” — verified independently afterwards: one-way ✓ Zürich ✓ London ✓ date ✓ 3 flights visible.`,
  secHow_h:"How it works",
  secHow_note:"Three mechanisms carry the whole design: <b>one atomic snapshot</b> per observation, <b>one speculative request</b> per decision, and <b>guards instead of invalidation</b> before input.",

  p3h:"The real run, millisecond by millisecond",

  wfHint:"hover any segment · click a row for details",
  p4h:"Matched A/B — three alternating pairs",
  p4note:"Six runs, one task, one Chrome profile, identical models on both arms (the difference is the loop, not the model). No failures, no exclusions.",
  mMs:"Task time", mCdp:"Browser calls", mTs:"TypeSafe requests",
  p5h:"What actually changed",
  w1h:"One atomic snapshot vs repeated tree reads",
  w1b:"The original loop re-read the accessibility tree (30×) and resolved 828 DOM nodes. The new snapshot.js reads all visible controls, labels, values and geometry in a single evaluate.",
  w2h:"Speculative fan-out, one round trip",
  w2b:"Operation and every compatible target head share one request. Unused heads are discarded — two decisions for the price of one network call.",
  w3h:"Guards instead of invalidation",
  w3b:"Original: any DOM mutation (including animations) invalidated the decision. New: validate the selected target — identity, geometry, occlusion — right before input.",
  w4h:"Wait for useful state",
  w4b:"After typing into a combobox, wait up to 200 ms for visible suggestions — so Jev chooses from the real popup, not a stale page.",

     {t:"Cognitive ease → the escalation funnel",
      b:`Confidence-gated routing is <b>“ease vs strain” as an API</b>: act while calibrated confidence is high; escalate to a bigger model or a human when it drops. The same logic as this harness handing bulk sub-tasks to cheaper models and synthesizing on a stronger one — the cascade, applied at three grain sizes: per decision, per failure, per task.`},

    callout:`📖 <b>If the book landed for you:</b> Kahneman's own admission was that decades of studying bias left his intuitive thinking just as overconfident — the fix is external procedure, which is exactly what every guard in this repo is. His sequel <b><i>Noise</i></b> (2021, with Sibony &amp; Sunstein) is the direct continuation: variance in judgment and “decision hygiene” — the case for typed, calibrated decisions over free-form ones. (Traditional Chinese edition: <a href="https://www.eslite.com/product/10012030542682410260007" target="_blank" rel="noopener">《快思慢想》</a>, trans. Hung-lan, Global View Publishing.)`},

/* ============================ PART 1 · LOOP ============================ */
const PHASES = () => T().loopSteps.phases;
let lp = 0, lpTimer = null, lpPlaying = false;
function loopRender(){
  const el = $("loopDiagram"); el.innerHTML = "";
  const ph = PHASES();
  ph.forEach((p,i)=>{
    const row = document.createElement("div");
    row.className = "phase" + (i===lp?" active": i<lp?" done":"");
    let fan = "";
    if (p.fanout){
      const fh = T().loopSteps.fanHeads;
      fan = `<div class="fanout">
        <span class="head win">${fh.win1}</span>
        <span class="head dead">${fh.dead1}</span>
        <span class="head dead">${fh.dead2}</span>
        <span class="head win">${fh.win2}</span>
      </div>`;
    }
    row.innerHTML = `<span class="tag">${LANG==="en" ? "step "+(i+1) : "第 "+(i+1)+" 步"}</span>
      <div class="body"><div class="t">${p.t}</div><div class="d">${p.d}</div>${fan}</div>
      <span class="cost">${p.cost}</span>`;
    el.appendChild(row);
  });
  $("loopCaption").innerHTML = ph[lp].cap;
  $("loopPos").textContent = T().stepPos(lp+1, ph.length);
  $("loopPrev").disabled = lp===0; $("loopNext").disabled = lp===ph.length-1;
}
function loopStop(){ lpPlaying=false; clearInterval(lpTimer); $("loopPlay").textContent=T().play; }
$("loopPlay").onclick = () => {
  if (lpPlaying) return loopStop();
  lpPlaying = true; $("loopPlay").textContent = T().pause;
  if (lp >= PHASES().length-1) lp = 0;
  loopRender();
  lpTimer = setInterval(()=>{ if (lp < PHASES().length-1){ lp++; loopRender(); } else loopStop(); }, 1600);
};
$("loopNext").onclick = ()=>{ loopStop(); lp=Math.min(lp+1,PHASES().length-1); loopRender(); };
$("loopPrev").onclick = ()=>{ loopStop(); lp=Math.max(lp-1,0); loopRender(); };
$("loopReset").onclick = ()=>{ loopStop(); lp=0; loopRender(); };

/* ============================ PART 3 · WATERFALL ============================ */
const WF = {W:1060, L:290, R:24, rowH:33, top:34};
const px = ms => WF.L + (ms/RUN.total)*(WF.W-WF.L-WF.R);
const CL = {jev:"#34d399", gen:"#fbbf24", exec:"#38bdf8", base:"#64748b"};
const rows = RUN.actions.map((a,i)=>{
  const start = i===0 ? a.exec - a.lat - a.tlat : RUN.actions[i-1].el;
  const dEnd = start + a.lat, tEnd = dEnd + a.tlat;
  const eStart = Math.max(dEnd, tEnd, a.exec);
  return {...a, i, start, dEnd, tEnd, eStart, eEnd:a.el};
});
function rowLabel(r){
  const act = r.act[LANG==="en"?"en":"zh"];
  if (r.op==="DONE") return LANG==="en" ? "DONE · verified ✓" : "DONE · 已驗證 ✓";
  const max = LANG==="en" ? 34 : 16;
  const a = act.length > max ? act.slice(0,max-1)+"…" : act;
  return `${r.op}: ${a}`;
}
function segRect(y, x1, x2, color, tip, rowIdx){
  if (x2 - x1 < 0.8) return "";
  const w = Math.max(x2-x1, 1.6);
  return `<rect x="${x1}" y="${y}" width="${w}" height="18" rx="4" fill="${color}" opacity="0.92"
    data-tip="${tip.replace(/"/g,"&quot;")}" data-row="${rowIdx}" style="cursor:pointer"/>`;
}
function buildWF(){
  const L = T().wf;
  let s = "";
  for (let t=0; t<=7000; t+=1000){
    s += `<line x1="${px(t)}" y1="${WF.top-6}" x2="${px(t)}" y2="${WF.top+rows.length*WF.rowH+4}" stroke="#1d2836" stroke-width="1"/>
          <text x="${px(t)}" y="${WF.top-12}" fill="#5b6b7f" font-size="10" text-anchor="middle">${(t/1000).toFixed(0)}s</text>`;
  }
  rows.forEach((r,i)=>{
    const y = WF.top + i*WF.rowH;
    s += `<text x="8" y="${y+13}" fill="${r.op==="DONE" ? "#8496ab" : "#dce5f0"}" font-size="10.5">${rowLabel(r)}</text>`;
    const actFull = r.act[LANG==="en"?"en":"zh"];
    s += segRect(y, px(r.start), px(r.dEnd), CL.jev, L.tipDecide(r.lat, `${r.op} → ${actFull}`), i);
    if (r.tlat>0) s += segRect(y, px(r.dEnd), px(r.tEnd), CL.gen, L.tipText(r.text[LANG==="en"?"en":"zh"], r.tlat), i);
    s += segRect(y, px(Math.max(r.eStart, r.dEnd)), px(r.eEnd), r.op==="DONE"? CL.base : CL.exec,
      r.op==="DONE" ? L.tipDone() : L.tipExec(r.eEnd-r.eStart), i);
  });
  const yS = WF.top, yE = WF.top + rows.length*WF.rowH + 4;
  s += `<line x1="${px(5217)}" y1="${yS}" x2="${px(5217)}" y2="${yE}" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="${px(5217)+5}" y="${yS+9}" fill="#38bdf8" font-size="10.5" class="mark">${L.searchMark}</text>`;
  s += `<line id="playhead" x1="${px(0)}" y1="${yS-2}" x2="${px(0)}" y2="${yE}" stroke="#f87171" stroke-width="2" opacity="0"/>`;
  $("wf").innerHTML = s;
  $("wfLegend").innerHTML = L.legend.map((t,i)=>
    `<span><span class="sw" style="background:${[CL.jev,CL.gen,CL.exec,CL.base][i]}"></span>${t}</span>`).join("");
}
let wfT = 0, wfSpeed = 1, wfPlaying = false, wfLast = 0, wfRaf = null;
function counters(t){
  let req=0, texts=0, acts=0;
  rows.forEach(r=>{
    if (t >= r.start) req++;
    if (r.tlat>0 && t >= r.dEnd) texts++;
    if (t >= r.eStart && r.op!=="DONE") acts++;
  });
  req = Math.min(req + 5, RUN.requests); // +5 stale re-decisions — see note
  $("wfCounters").innerHTML = T().wf.counters(req, RUN.requests, acts, texts, (t/1000).toFixed(3));
}
function wfFrame(ts){
  if (!wfLast) wfLast = ts;
  wfT += (ts - wfLast) * wfSpeed; wfLast = ts;
  if (wfT >= RUN.total){ wfT = RUN.total; wfDraw(); counters(wfT); return wfStop(); }
  wfDraw(); counters(wfT);
  wfRaf = requestAnimationFrame(wfFrame);
}
function wfDraw(){
  const ph = document.getElementById("playhead");
  if (!ph) return;
  ph.setAttribute("x1", px(wfT)); ph.setAttribute("x2", px(wfT)); ph.setAttribute("opacity", wfT>0 ? "1" : "0");
  const el = $("wfClock"); if (el) el.textContent = (wfT/1000).toFixed(3)+" s";
  const c2 = $("wfClock2"); if (c2) c2.textContent = (wfT/1000).toFixed(3)+" s";
  document.querySelectorAll("#wf rect[data-row]").forEach(r=>{
    const i = +r.dataset.row, row = rows[i];
    const active = wfT >= row.start && wfT < row.eEnd + (i===rows.length-1? 1:0);
    r.setAttribute("stroke", active ? "#f87171" : "none");
    r.setAttribute("stroke-width", active ? "1.5" : "0");
  });
}
function wfStop(){ wfPlaying=false; cancelAnimationFrame(wfRaf); $("wfPlay").textContent=T().play; wfLast=0; }
$("wfPlay").onclick = ()=>{
  if (wfPlaying) return wfStop();
  wfPlaying = true; $("wfPlay").textContent=T().pause; wfLast=0;
  if (wfT >= RUN.total) wfT = 0;
  wfRaf = requestAnimationFrame(wfFrame);
};
document.querySelectorAll("#wfSpeed button").forEach(b=> b.onclick = ()=>{
  wfSpeed = +b.dataset.s;
  document.querySelectorAll("#wfSpeed button").forEach(x=>x.classList.toggle("active", x===b));
});
const tip = $("tooltip");
document.addEventListener("mousemove", e=>{
  const t = e.target.closest ? e.target.closest("rect[data-tip]") : null;
  if (t){ tip.innerHTML = t.dataset.tip; tip.style.opacity = 1;
    tip.style.left = Math.min(e.clientX+14, innerWidth-350)+"px"; tip.style.top = (e.clientY+14)+"px";
  } else tip.style.opacity = 0;
});
$("wf").addEventListener("click", e=>{
  const t = e.target.closest && e.target.closest("rect[data-row]");
  if (!t) return;
  const L = T().wf, r = rows[+t.dataset.row];
  const parts = [L.stepHdr(r.i+1, r.op) + ` → <b>${r.act[LANG==="en"?"en":"zh"]}</b>`];
  if (r.text) parts.push(L.typed(r.text[LANG==="en"?"en":"zh"], r.tlat, r.text.en==="Zurich"?440:483));
  parts.push(L.decideLine(r.lat, (r.exec/1000).toFixed(3), (r.el/1000).toFixed(3)));

  $("wfStep").innerHTML = parts.join("<br>");
});

/* ============================ PART 4 · DUMBBELLS ============================ */
const METRICS = {
  ms:  {max:12000, fmt:v=>(v/1000).toFixed(2)+" s", axis:"axisMs", delta:v=>`−${(100*(1-v)).toFixed(1)}%`},
  cdp: {max:1200,  fmt:v=>fmt(v), axis:"axisCdp", delta:v=>`−${(100*(1-v)).toFixed(0)}%`},
  ts:  {max:30,    fmt:v=>fmt(v), axis:"axisTs", delta:v=>`−${(100*(1-v)).toFixed(0)}%`},
};
let metric = "ms";
function buildDumb(){
  const L = T().dumb, m = METRICS[metric];
  const W=1060, Lx=150, R=110, top=36, rowH=56;
  const X = v => Lx + (v/m.max)*(W-Lx-R);
  let s = `<text x="${Lx-24}" y="16" fill="#8496ab" font-size="11">${L[m.axis]}</text>`;
  for (let i=0;i<=4;i++){
    const v = m.max*i/4;
    s += `<line x1="${X(v)}" y1="${top}" x2="${X(v)}" y2="${top+4*rowH}" stroke="#1d2836"/>
          <text x="${X(v)}" y="${top-6}" fill="#5b6b7f" font-size="10" text-anchor="middle">${metric==="ms"? (v/1000).toFixed(0)+"s":fmt(v)}</text>`;
  }
  const vfmt = v => metric==="ms" ? (v/1000).toFixed(2)+" s" : fmt(v);
  PAIRS.forEach((p,i)=>{
    const y = top + i*rowH + 14;
    const b = X(p.base[metric]), c = X(p.cand[metric]);
    s += `<text x="8" y="${y+4}" fill="#8496ab" font-size="11.5">${L.pair(p.pair)}</text>
      <line x1="${b}" y1="${y}" x2="${c}" y2="${y}" stroke="#33465e" stroke-width="2"/>
      <circle cx="${b}" cy="${y}" r="8" fill="#7c8ba1" data-tip="${L.tipBase(p.pair, vfmt(p.base[metric]), p.base.ts, p.base.cdp).replace(/"/g,"&quot;")}"/>
      <circle cx="${c}" cy="${y}" r="8" fill="#34d399" data-tip="${L.tipCand(p.pair, vfmt(p.cand[metric]), p.cand.ts, p.cand.cdp).replace(/"/g,"&quot;")}"/>
      <text x="${W-8}" y="${y+4}" fill="#34d399" font-size="11.5" text-anchor="end">${m.delta(p.cand[metric]/p.base[metric])}</text>`;
  });
  const y = top + 3*rowH + 14, b = X(MEDIAN.base[metric]), c = X(MEDIAN.cand[metric]);
  s += `<line x1="${Lx}" y1="${y-24}" x2="${W-R+60}" y2="${y-24}" stroke="#1d2836"/>
    <text x="8" y="${y+4}" fill="#dce5f0" font-size="11.5" font-weight="700">${L.median}</text>
    <line x1="${b}" y1="${y}" x2="${c}" y2="${y}" stroke="#4b5b70" stroke-width="2.5"/>
    <circle cx="${b}" cy="${y}" r="9" fill="#7c8ba1" data-tip="${L.tipBaseMed(vfmt(MEDIAN.base[metric])).replace(/"/g,"&quot;")}"/>
    <circle cx="${c}" cy="${y}" r="9" fill="#34d399" stroke="#a7f3d0" data-tip="${L.tipCandMed(vfmt(MEDIAN.cand[metric])).replace(/"/g,"&quot;")}"/>
    <text x="${W-8}" y="${y+4}" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="end">${m.delta(MEDIAN.cand[metric]/MEDIAN.base[metric])}</text>
    <text x="${Lx-24}" y="${top+4*rowH+22}" fill="#5b6b7f" font-size="10.5">${L.legend}</text>`;
  $("dumb").innerHTML = s;
  $("abNote").innerHTML = T().ab[metric];
}

  metric = b.dataset.m;

  buildDumb();
});

  if (!h) return;
  const i = +h.parentElement.dataset.i;
  kbOpen = (kbOpen === i) ? -1 : i; // click again to collapse
  kbRender();
});

/* ============================ i18n plumbing ============================ */
let LANG = "en";
try { LANG = localStorage.getItem("jevVizLang") || "en"; } catch(e){}
function applyLang(){
  const L = T();
  document.documentElement.lang = LANG==="en" ? "en" : "zh-HK";
  document.title = L.title;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.innerHTML = L[el.dataset.i18n] ?? ""; });
  $("h1").innerHTML = L.h1;
  $("subTitle").innerHTML = L.subTitle;
  $("loopPlay").textContent = lpPlaying ? L.pause : L.play;
  $("loopPrev").textContent = L.prev; $("loopNext").textContent = L.next; $("loopReset").textContent = L.reset;
  $("wfPlay").textContent = wfPlaying ? L.pause : L.play;
  $("wfStep").innerHTML = L.wf.stepDefault;
  $("foot").innerHTML = L.foot;
  document.querySelectorAll("#langSeg button").forEach(b=> b.classList.toggle("active", b.dataset.l===LANG));
  loopRender(); compRender(); buildWF(); buildDumb(); counters(wfT); wfDraw(); kbRender();
}
document.querySelectorAll("#langSeg button").forEach(b=> b.onclick = ()=>{
  LANG = b.dataset.l;
  try { localStorage.setItem("jevVizLang", LANG); } catch(e){}
  applyLang();
});
applyLang();
</script>
